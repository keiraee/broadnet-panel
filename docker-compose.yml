services:
  app:
    build: .
    image: broadnet-panel:latest
    container_name: broadnet-panel
    ports:
      # Container listens on 9993.
      # Windows Hyper-V may block host 9993 (excluded range ~9906–10005).
      # If bind fails, use: "39993:9993" and open http://localhost:39993/
      - "9993:9993"
    environment:
      PORT: "9993"
      HEADLESS: "1"
      BROWSER_PROFILE: /data/browser-profile
      KEEPALIVE_MS: "600000"
    volumes:
      - browser-profile:/data/browser-profile
    restart: unless-stopped

volumes:
  browser-profile:
